<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clientes DyL" />
  <title>Clientes DyL · CABA y Zona Sur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: '#0F172A', accent: '#0EA5E9' },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Space Grotesk', 'Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    :root { color-scheme: dark; }
    html, body { background: #0B1220; }
    body { padding-bottom: env(safe-area-inset-bottom); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .card { background: linear-gradient(180deg, rgba(15,23,42,.94), rgba(15,23,42,.8)); border: 1px solid rgba(56,189,248,.12); }
    .chip { border: 1px solid rgba(56,189,248,.22); }
    textarea, input, select { background: #0B1220; }
    @media print {
      nav, header, .no-print, #tab-directorio, #tab-cartera, #tab-config { display: none !important; }
      body { background: #fff; color: #111; }
      #printArea { display: block !important; color: #111; }
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 font-sans">
  <header class="sticky top-0 z-40 border-b border-sky-500/10 bg-[#0B1220]/90 backdrop-blur-xl">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <p class="font-display text-lg tracking-tight"><span class="font-bold">DyL</span> <span class="text-sky-400">Clientes</span></p>
        <p class="text-[11px] text-slate-400">CABA y Zona Sur · directorio + propuestas</p>
      </div>
      <button onclick="showTab('config')" class="text-xs px-3 py-1.5 rounded-full chip text-sky-300">Ajustes</button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pt-4 pb-28">
    <section id="tab-directorio">
      <div class="card rounded-2xl p-4 mb-4">
        <h2 class="font-display text-xl mb-1">Directorio</h2>
        <p class="text-sm text-slate-400 mb-3">Prospectos de CABA y Zona Sur con contacto adentro. Datos públicos: verificá teléfono antes de escribir.</p>
        <div class="flex gap-2 mb-3">
          <button onclick="setZona('todas')" data-z="todas" class="zchip chip rounded-full px-3 py-1.5 text-xs">Todas</button>
          <button onclick="setZona('CABA')" data-z="CABA" class="zchip chip rounded-full px-3 py-1.5 text-xs">CABA</button>
          <button onclick="setZona('Zona Sur')" data-z="Zona Sur" class="zchip chip rounded-full px-3 py-1.5 text-xs">Zona Sur</button>
        </div>
        <div class="grid grid-cols-2 gap-2 mb-3">
          <select id="fLoc" onchange="renderDir()" class="rounded-xl border border-sky-500/20 px-3 py-2.5 text-sm"></select>
          <select id="fRubro" onchange="renderDir()" class="rounded-xl border border-sky-500/20 px-3 py-2.5 text-sm"></select>
        </div>
        <input id="fQ" oninput="renderDir()" placeholder="Buscar por nombre, barrio, teléfono…" class="w-full rounded-xl border border-sky-500/20 px-3 py-2.5 text-sm" />
        <p id="dirCount" class="text-xs text-slate-500 mt-2"></p>
      </div>
      <div id="dirList" class="space-y-3"></div>
    </section>

    <section id="tab-cartera" class="hidden">
      <div class="flex items-center justify-between mb-3">
        <div>
          <h2 class="font-display text-xl">Cartera</h2>
          <p id="carteraCount" class="text-xs text-slate-400"></p>
        </div>
        <button onclick="openClientModal()" class="rounded-full bg-sky-500 text-ink text-sm font-semibold px-4 py-2">+ Cliente</button>
      </div>
      <div class="flex gap-2 overflow-x-auto no-scrollbar mb-3">
        <button onclick="setFilter('todos')" data-f="todos" class="filt chip whitespace-nowrap rounded-full px-3 py-1.5 text-xs">Todos</button>
        <button onclick="setFilter('prospecto')" data-f="prospecto" class="filt chip whitespace-nowrap rounded-full px-3 py-1.5 text-xs">Prospecto</button>
        <button onclick="setFilter('contactado')" data-f="contactado" class="filt chip whitespace-nowrap rounded-full px-3 py-1.5 text-xs">Contactado</button>
        <button onclick="setFilter('propuesta')" data-f="propuesta" class="filt chip whitespace-nowrap rounded-full px-3 py-1.5 text-xs">Propuesta</button>
        <button onclick="setFilter('cliente')" data-f="cliente" class="filt chip whitespace-nowrap rounded-full px-3 py-1.5 text-xs">Cliente</button>
      </div>
      <input id="q" oninput="renderCartera()" placeholder="Filtrar cartera…" class="w-full mb-3 rounded-xl border border-sky-500/20 px-3 py-2.5 text-sm" />
      <div id="carteraList" class="space-y-3"></div>
    </section>

    <section id="tab-propuesta" class="hidden">
      <div class="card rounded-2xl p-4">
        <h2 class="font-display text-xl mb-1">Propuesta</h2>
        <p class="text-sm text-slate-400 mb-4">Se arma según el rubro. Un toque y sale por WhatsApp.</p>
        <label class="text-xs text-slate-400">Cliente de la cartera</label>
        <select id="propClient" onchange="fillFromClient()" class="w-full mt-1 mb-3 rounded-xl border border-sky-500/20 px-3 py-2.5 text-sm"></select>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-slate-400">Nombre</label>
            <input id="propNombre" class="w-full mt-1 rounded-xl border border-sky-500/20 px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="text-xs text-slate-400">Rubro</label>
            <select id="propRubro" class="w-full mt-1 rounded-xl border border-sky-500/20 px-3 py-2 text-sm"></select>
          </div>
        </div>
        <label class="text-xs text-slate-400 mt-3 block">WhatsApp del cliente</label>
        <input id="propPhone" inputmode="tel" placeholder="54911…" class="w-full mt-1 mb-3 rounded-xl border border-sky-500/20 px-3 py-2 text-sm" />
        <label class="text-xs text-slate-400">Mensaje</label>
        <textarea id="propMsg" rows="12" class="w-full mt-1 rounded-xl border border-sky-500/20 px-3 py-2 text-sm leading-relaxed"></textarea>
        <div class="grid grid-cols-2 gap-2 mt-3">
          <button onclick="copyMsg()" class="rounded-xl bg-slate-800 border border-sky-500/20 py-3 text-sm">Copiar</button>
          <button onclick="sendWA()" class="rounded-xl bg-emerald-500 text-ink font-semibold py-3 text-sm">Enviar WhatsApp</button>
        </div>
        <button onclick="printProposal()" class="w-full mt-2 rounded-xl border border-sky-400/30 text-sky-300 py-2.5 text-sm">Ver / imprimir propuesta formal</button>
      </div>
    </section>

    <section id="tab-config" class="hidden">
      <div class="card rounded-2xl p-4 mb-4">
        <h2 class="font-display text-xl mb-3">Datos de DyL</h2>
        <label class="text-xs text-slate-400">Nombre comercial</label>
        <input id="cfgName" class="w-full mt-1 mb-3 rounded-xl border border-sky-500/20 px-3 py-2 text-sm" />
        <label class="text-xs text-slate-400">WhatsApp (con 54)</label>
        <input id="cfgWA" class="w-full mt-1 mb-3 rounded-xl border border-sky-500/20 px-3 py-2 text-sm" />
        <label class="text-xs text-slate-400">Instagram</label>
        <input id="cfgIG" class="w-full mt-1 mb-3 rounded-xl border border-sky-500/20 px-3 py-2 text-sm" />
        <label class="text-xs text-slate-400">Email</label>
        <input id="cfgMail" class="w-full mt-1 mb-3 rounded-xl border border-sky-500/20 px-3 py-2 text-sm" />
        <label class="text-xs text-slate-400">Zona / pie</label>
        <input id="cfgZona" class="w-full mt-1 mb-3 rounded-xl border border-sky-500/20 px-3 py-2 text-sm" />
        <button onclick="saveCfg()" class="w-full rounded-xl bg-sky-500 text-ink font-semibold py-3 text-sm">Guardar</button>
      </div>
      <div class="card rounded-2xl p-4">
        <h3 class="font-display mb-2">Respaldo de cartera</h3>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="exportData()" class="rounded-xl bg-slate-800 border border-sky-500/20 py-3 text-sm">Exportar</button>
          <label class="rounded-xl bg-slate-800 border border-sky-500/20 py-3 text-sm text-center cursor-pointer">
            Importar
            <input type="file" accept="application/json" class="hidden" onchange="importData(event)" />
          </label>
        </div>
        <button onclick="if(confirm('¿Borrar la cartera?')){localStorage.removeItem('dyl_clients'); renderCartera(); fillPropClients();}" class="w-full mt-2 text-rose-400 text-sm py-2">Vaciar cartera</button>
      </div>
    </section>
  </main>

  <nav class="fixed bottom-0 inset-x-0 z-40 border-t border-sky-500/10 bg-[#0B1220]/95 backdrop-blur-xl pb-[env(safe-area-inset-bottom)]">
    <div class="max-w-3xl mx-auto grid grid-cols-3 text-center text-[11px]">
      <button onclick="showTab('directorio')" class="navbtn py-3 text-sky-300" data-t="directorio">Directorio</button>
      <button onclick="showTab('cartera')" class="navbtn py-3 text-slate-400" data-t="cartera">Cartera</button>
      <button onclick="showTab('propuesta')" class="navbtn py-3 text-slate-400" data-t="propuesta">Propuesta</button>
    </div>
  </nav>

  <div id="modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm p-4 overflow-y-auto">
    <div class="max-w-md mx-auto mt-8 card rounded-2xl p-4">
      <div class="flex justify-between items-center mb-3">
        <h3 id="modalTitle" class="font-display text-lg">Nuevo cliente</h3>
        <button onclick="closeModal()" class="text-slate-400">Cerrar</button>
      </div>
      <input type="hidden" id="cId" />
      <label class="text-xs text-slate-400">Nombre / empresa *</label>
      <input id="cName" class="w-full mt-1 mb-2 rounded-xl border border-sky-500/20 px-3 py-2 text-sm" />
      <label class="text-xs text-slate-400">Rubro</label>
      <select id="cRubro" class="w-full mt-1 mb-2 rounded-xl border border-sky-500/20 px-3 py-2 text-sm"></select>
      <label class="text-xs text-slate-400">Localidad</label>
      <input id="cLoc" class="w-full mt-1 mb-2 rounded-xl border border-sky-500/20 px-3 py-2 text-sm" />
      <label class="text-xs text-slate-400">Teléfono / WhatsApp</label>
      <input id="cPhone" inputmode="tel" class="w-full mt-1 mb-2 rounded-xl border border-sky-500/20 px-3 py-2 text-sm" />
      <label class="text-xs text-slate-400">Email</label>
      <input id="cEmail" class="w-full mt-1 mb-2 rounded-xl border border-sky-500/20 px-3 py-2 text-sm" />
      <label class="text-xs text-slate-400">Web</label>
      <input id="cWeb" class="w-full mt-1 mb-2 rounded-xl border border-sky-500/20 px-3 py-2 text-sm" />
      <label class="text-xs text-slate-400">Dirección</label>
      <input id="cDir" class="w-full mt-1 mb-2 rounded-xl border border-sky-500/20 px-3 py-2 text-sm" />
      <label class="text-xs text-slate-400">Estado</label>
      <select id="cStatus" class="w-full mt-1 mb-2 rounded-xl border border-sky-500/20 px-3 py-2 text-sm">
        <option value="prospecto">Prospecto</option>
        <option value="contactado">Contactado</option>
        <option value="propuesta">Propuesta enviada</option>
        <option value="cliente">Cliente</option>
        <option value="descartado">Descartado</option>
      </select>
      <label class="text-xs text-slate-400">Notas</label>
      <textarea id="cNotes" rows="3" class="w-full mt-1 mb-3 rounded-xl border border-sky-500/20 px-3 py-2 text-sm"></textarea>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="saveClient()" class="rounded-xl bg-sky-500 text-ink font-semibold py-3 text-sm">Guardar</button>
        <button onclick="deleteClient()" class="rounded-xl border border-rose-500/40 text-rose-300 py-3 text-sm">Eliminar</button>
      </div>
    </div>
  </div>

  <div id="printArea" class="hidden p-8 bg-white text-slate-900"></div>

      name: 'DyL 3D Prints',

    let zona = 'todas';

    function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
    function getCfg(){ try { return {...defaultCfg, ...JSON.parse(localStorage.getItem('dyl_cfg')||'{}')}; } catch { return {...defaultCfg}; } }
    function getClients(){ try { return JSON.parse(localStorage.getItem('dyl_clients')||'[]'); } catch { return []; } }
    function setClients(list){ localStorage.setItem('dyl_clients', JSON.stringify(list)); }
    function rubroLabel(id){ return (RUBROS.find(r=>r.id===id)||{}).label || id; }
    function cleanPhone(p){
      if (!p) return '';
      let n = String(p).replace(/\D/g,'');
      if (n.startsWith('00')) n = n.slice(2);
      if (n.startsWith('54')) return n;
      if (n.startsWith('9') && n.length>=10) return '54'+n;
      if (n.startsWith('15') && n.length>=10) return '549'+n.slice(2);
      if (n.startsWith('11')) return '54'+n;
      if (n.length===10) return '54'+n;
      return n;
    }
    function statusColor(s){
      return {prospecto:'text-sky-300', contactado:'text-amber-300', propuesta:'text-violet-300', cliente:'text-emerald-300', descartado:'text-slate-500'}[s] || 'text-slate-400';
    }

    function fillFilters(){
      const locs = ['Todas las localidades', ...[...new Set(DIR.map(d=>d.loc))].sort()];
      document.getElementById('fLoc').innerHTML = locs.map((l,i)=>`<option value="${i===0?'':l}">${l}</option>`).join('');
      document.getElementById('fRubro').innerHTML = '<option value="">Todos los rubros</option>' + RUBROS.map(r=>`<option value="${r.id}">${r.label}</option>`).join('');
      const rubroOpts = RUBROS.map(r=>`<option value="${r.id}">${r.label}</option>`).join('');
      document.getElementById('cRubro').innerHTML = rubroOpts;
      document.getElementById('propRubro').innerHTML = rubroOpts;
    }

    function setZona(z){
      zona = z;
      document.querySelectorAll('.zchip').forEach(b=>{
        const on = b.dataset.z===z;
        b.classList.toggle('bg-sky-500', on);
        b.classList.toggle('text-ink', on);
      });
      renderDir();
    }

    function filteredDir(){
      const loc = document.getElementById('fLoc').value;
      const rubro = document.getElementById('fRubro').value;
      const q = (document.getElementById('fQ').value||'').toLowerCase();
      return DIR.filter(d => {
        if (zona!=='todas' && d.zona!==zona) return false;
        if (loc && d.loc!==loc) return false;
        if (rubro && d.rubro!==rubro) return false;
        if (q && ![d.name,d.loc,d.phone,d.email,d.dir,d.notes].join(' ').toLowerCase().includes(q)) return false;
        return true;
      });
    }

    function contactBtns(d){
      const ph = cleanPhone(d.phone);
      let html = '';
      if (ph) html += `<a class="text-xs px-3 py-1.5 rounded-full bg-emerald-500/15 text-emerald-300" href="https://wa.me/${ph}">WhatsApp</a>`;
      if (d.phone) html += `<a class="text-xs px-3 py-1.5 rounded-full chip" href="tel:${d.phone}">Llamar</a>`;
      if (d.email) html += `<a class="text-xs px-3 py-1.5 rounded-full chip" href="mailto:${d.email}">Mail</a>`;
      if (d.web) html += `<a class="text-xs px-3 py-1.5 rounded-full chip" href="${d.web}" target="_blank">Web</a>`;
      return html;
    }

    function renderDir(){
      const list = filteredDir();
      document.getElementById('dirCount').textContent = `${list.length} comercios`;
      document.getElementById('dirList').innerHTML = list.map((d)=>`
        <article class="card rounded-2xl p-4">
          <div class="flex justify-between gap-2">
            <div>
              <p class="font-medium">${d.name}</p>
              <p class="text-xs text-slate-400">${rubroLabel(d.rubro)} · ${d.loc} · ${d.zona}</p>
            </div>
          </div>
          ${d.dir ? `<p class="text-xs text-slate-500 mt-1">${d.dir}</p>` : ''}
          <div class="mt-2 space-y-0.5 text-sm">
            ${d.phone ? `<p>Tel. ${d.phone}</p>` : '<p class="text-slate-500 text-xs">Sin teléfono publicado</p>'}
            ${d.email ? `<p class="text-xs text-sky-300">${d.email}</p>` : ''}
          </div>
          ${d.notes ? `<p class="text-xs text-slate-400 mt-2">${d.notes}</p>` : ''}
          <div class="flex flex-wrap gap-2 mt-3">
            ${contactBtns(d)}
            <button class="text-xs px-3 py-1.5 rounded-full bg-sky-500 text-ink font-medium" onclick="fromDirToProposal(${DIR.indexOf(d)})">Propuesta</button>
            <button class="text-xs px-3 py-1.5 rounded-full chip" onclick="saveFromDir(${DIR.indexOf(d)})">A cartera</button>
          </div>
        </article>`).join('') || '<p class="text-sm text-slate-500 py-8 text-center">No hay resultados con esos filtros.</p>';
    }

    function saveFromDir(i){
      const d = DIR[i];
      const list = getClients();
      if (list.some(c => c.name===d.name && c.phone===d.phone)) { alert('Ya está en la cartera'); return; }
      list.unshift({ id:uid(), name:d.name, rubro:d.rubro, loc:d.loc, phone:d.phone, email:d.email, web:d.web, dir:d.dir, notes:d.notes, status:'prospecto', created:Date.now() });
      setClients(list);
      alert('Guardado en cartera');
    }
    function fromDirToProposal(i){
      const d = DIR[i];
      const list = getClients();
      if (!list.some(c => c.name===d.name && c.phone===d.phone)) {
        list.unshift({ id:uid(), name:d.name, rubro:d.rubro, loc:d.loc, phone:d.phone, email:d.email, web:d.web, dir:d.dir, notes:d.notes, status:'prospecto', created:Date.now() });
        setClients(list);
      }
      showTab('propuesta');
      document.getElementById('propNombre').value = d.name;
      document.getElementById('propRubro').value = d.rubro;
      document.getElementById('propPhone').value = cleanPhone(d.phone);
      const saved = getClients().find(c => c.name===d.name);
      if (saved) document.getElementById('propClient').value = saved.id;
      buildProposal();
    }

    function showTab(t){
      ['directorio','cartera','propuesta','config'].forEach(id=>{
        document.getElementById('tab-'+id).classList.toggle('hidden', id!==t);
      });
      document.querySelectorAll('.navbtn').forEach(b=>{
        b.classList.toggle('text-sky-300', b.dataset.t===t);
        b.classList.toggle('text-slate-400', b.dataset.t!==t);
      });
      if (t==='cartera') renderCartera();
      if (t==='propuesta'){ fillPropClients(); buildProposal(); }
      if (t==='config') loadCfgForm();
    }

    function setFilter(f){ filter=f; renderCartera(); }
    function renderCartera(){
      const q = (document.getElementById('q').value||'').toLowerCase();
      let list = getClients();
      if (filter!=='todos') list = list.filter(c=>c.status===filter);
      if (q) list = list.filter(c => [c.name,c.loc,c.rubro,c.notes,c.phone].join(' ').toLowerCase().includes(q));
      document.getElementById('carteraCount').textContent = `${list.length} contactos`;
      document.querySelectorAll('.filt').forEach(b=>{
        b.classList.toggle('bg-sky-500', b.dataset.f===filter);
        b.classList.toggle('text-ink', b.dataset.f===filter);
      });
      if (!list.length) {
        document.getElementById('carteraList').innerHTML = '<p class="text-sm text-slate-500 py-8 text-center">Todavía no guardaste nadie. En Directorio tocá “A cartera”.</p>';
        return;
      }
      document.getElementById('carteraList').innerHTML = list.map(c=>`
        <article class="card rounded-2xl p-4">
          <div class="flex justify-between gap-2">
            <div>
              <p class="font-medium">${c.name}</p>
              <p class="text-xs text-slate-400">${rubroLabel(c.rubro)} · ${c.loc||'—'}</p>
            </div>
            <span class="text-[11px] ${statusColor(c.status)}">${c.status}</span>
          </div>
          ${c.dir ? `<p class="text-xs text-slate-500 mt-1">${c.dir}</p>` : ''}
          ${c.phone ? `<p class="text-sm mt-1">${c.phone}</p>` : ''}
          ${c.email ? `<p class="text-xs text-sky-300">${c.email}</p>` : ''}
          ${c.notes ? `<p class="text-xs text-slate-400 mt-2">${c.notes}</p>` : ''}
          <div class="flex flex-wrap gap-2 mt-3">
            ${contactBtns(c)}
            <button class="text-xs px-3 py-1.5 rounded-full bg-sky-500 text-ink font-medium" onclick="goProposal('${c.id}')">Propuesta</button>
            <button class="text-xs px-3 py-1.5 rounded-full chip" onclick="openClientModal('${c.id}')">Editar</button>
          </div>
        </article>`).join('');
    }

    function openClientModal(id){
      const c = id ? getClients().find(x=>x.id===id) : null;
      document.getElementById('modalTitle').textContent = c ? 'Editar cliente' : 'Nuevo cliente';
      document.getElementById('cId').value = c?.id || '';
      document.getElementById('cName').value = c?.name || '';
      document.getElementById('cRubro').value = c?.rubro || 'arquitectura';
      document.getElementById('cLoc').value = c?.loc || '';
      document.getElementById('cPhone').value = c?.phone || '';
      document.getElementById('cEmail').value = c?.email || '';
      document.getElementById('cWeb').value = c?.web || '';
      document.getElementById('cDir').value = c?.dir || '';
      document.getElementById('cStatus').value = c?.status || 'prospecto';
      document.getElementById('cNotes').value = c?.notes || '';
      document.getElementById('modal').classList.remove('hidden');
    }
    function closeModal(){ document.getElementById('modal').classList.add('hidden'); }
    function saveClient(){
      const name = document.getElementById('cName').value.trim();
      if (!name) return alert('Poné el nombre');
      const item = {
        id: document.getElementById('cId').value || uid(),
        name,
        rubro: document.getElementById('cRubro').value,
        loc: document.getElementById('cLoc').value.trim(),
        phone: document.getElementById('cPhone').value.trim(),
        email: document.getElementById('cEmail').value.trim(),
        web: document.getElementById('cWeb').value.trim(),
        dir: document.getElementById('cDir').value.trim(),
        status: document.getElementById('cStatus').value,
        notes: document.getElementById('cNotes').value.trim(),
        created: Date.now()
      };
      let list = getClients();
      const i = list.findIndex(x=>x.id===item.id);
      if (i>=0) list[i] = {...list[i], ...item};
      else list.unshift(item);
      setClients(list);
      closeModal();
      renderCartera();
      fillPropClients();
    }
    function deleteClient(){
      const id = document.getElementById('cId').value;
      if (!id) return closeModal();
      if (!confirm('¿Eliminar este contacto?')) return;
      setClients(getClients().filter(c=>c.id!==id));
      closeModal();
      renderCartera();
      fillPropClients();
    }

    function fillPropClients(){
      const list = getClients();
      document.getElementById('propClient').innerHTML = '<option value="">— elegir de la cartera —</option>' + list.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
    }
    function fillFromClient(){
      const c = getClients().find(x=>x.id===document.getElementById('propClient').value);
      if (!c) return;
      document.getElementById('propNombre').value = c.name;
      document.getElementById('propRubro').value = c.rubro;
      document.getElementById('propPhone').value = cleanPhone(c.phone);
      buildProposal();
    }
    function goProposal(id){
      showTab('propuesta');
      document.getElementById('propClient').value = id;
      fillFromClient();
    }
    function buildProposal(){
      const cfg = getCfg();
      const nombre = document.getElementById('propNombre').value.trim() || 'equipo';
      const rubro = document.getElementById('propRubro').value;
      const body = PITCH[rubro] || PITCH.otro;
      document.getElementById('propMsg').value =
        `Hola ${nombre}, ¿qué tal? Soy de ${cfg.name}.\n\n${body}\n\nQuedo atento por acá.\n${cfg.name}\nWhatsApp ${cfg.wa}\n${cfg.ig} · ${cfg.mail}\n${cfg.zona}`;
    }
    function copyMsg(){
      const t = document.getElementById('propMsg').value;
      navigator.clipboard.writeText(t).then(()=>alert('Mensaje copiado')).catch(()=>prompt('Copiá:', t));
    }
    function sendWA(){
      const phone = cleanPhone(document.getElementById('propPhone').value);
      const msg = encodeURIComponent(document.getElementById('propMsg').value);
      const id = document.getElementById('propClient').value;
      if (id) {
        const list = getClients();
        const i = list.findIndex(c=>c.id===id);
        if (i>=0 && list[i].status==='prospecto') { list[i].status='propuesta'; setClients(list); }
      }
      window.open(phone ? `https://wa.me/${phone}?text=${msg}` : `https://wa.me/?text=${msg}`, '_blank');
    }
    function printProposal(){
      const cfg = getCfg();
      const nombre = document.getElementById('propNombre').value.trim() || 'Cliente';
      const body = document.getElementById('propMsg').value.replace(/\n/g,'<br>');
      document.getElementById('printArea').innerHTML = `
        <div style="font-family:Inter,sans-serif;max-width:720px;margin:auto">
          <h1 style="font-size:22px;margin:0">${cfg.name}</h1>
          <p style="color:#64748b;margin:4px 0 24px">Propuesta de servicio de impresión 3D</p>
          <p><b>Para:</b> ${nombre}</p>
          <hr style="border:none;border-top:1px solid #e2e8f0;margin:16px 0" />
          <div style="line-height:1.6">${body}</div>
          <p style="margin-top:32px;font-size:12px;color:#64748b">${cfg.zona} · ${cfg.mail} · ${cfg.ig}</p>
        </div>`;
      window.print();
    }

    function loadCfgForm(){
      const c = getCfg();
      document.getElementById('cfgName').value = c.name;
      document.getElementById('cfgWA').value = c.wa;
      document.getElementById('cfgIG').value = c.ig;
      document.getElementById('cfgMail').value = c.mail;
      document.getElementById('cfgZona').value = c.zona;
    }
    function saveCfg(){
      localStorage.setItem('dyl_cfg', JSON.stringify({
        name: document.getElementById('cfgName').value.trim(),
        wa: document.getElementById('cfgWA').value.trim(),
        ig: document.getElementById('cfgIG').value.trim(),
        mail: document.getElementById('cfgMail').value.trim(),
        zona: document.getElementById('cfgZona').value.trim()
      }));
      alert('Guardado');
    }
    function exportData(){
      const blob = new Blob([JSON.stringify({cfg:getCfg(), clients:getClients()}, null, 2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'clientes-dyl.json';
      a.click();
    }
    function importData(e){
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const d = JSON.parse(r.result);
          if (d.cfg) localStorage.setItem('dyl_cfg', JSON.stringify(d.cfg));
          if (d.clients) setClients(d.clients);
          renderCartera(); fillPropClients();
          alert('Importado');
        } catch { alert('Archivo inválido'); }
      };
      r.readAsText(f);
    }

    fillFilters();
    setZona('todas');
    document.getElementById('propRubro').addEventListener('change', buildProposal);
    document.getElementById('propNombre').addEventListener('input', buildProposal);
  </script>
</body>
</html>
